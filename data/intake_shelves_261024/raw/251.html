<p>

Tiny summary but <strong>detailed notes for each</strong>.
Read <strong><a href="/bfaq">my FAQ page</a></strong> for context.
This page will update as I read more, so bookmark it and check back.
</p>
</section>

<section>
<ul id="booklist">
<li data-rating="10" data-date="2025-09-03" data-title="Waste Books - by Georg Christoph Lichtenberg">
<figure>
<a href="/book/WasteBooks"><img src="https://m.sive.rs/images/book/WasteBooks.webp" loading="lazy" alt="Waste Books - by Georg Christoph Lichtenberg"></a>
<figcaption>
<h3><a href="/book/WasteBooks">Waste Books - by Georg Christoph Lichtenberg</a></h3>
<p class="meta">
Recommend it: <strong>10</strong>/10.
Date read: <time datetime="2025-09-03">2025-09-03</time>.
</p>
<p>
Tweets from 1765-1799 by a 4’9” hunchback physicist, friends with Goethe and Kant, admired by Nietzsche, Schopenhauer, etc.  Such wonderful random thoughts, beautiful perspectives on thinking for yourself, observing nature, language, freedom, philosophy, religion, and more.  Hundreds of initial insights, especially inspiring because they’re undeveloped.
</p>
</figcaption>
</figure>
</li>
<li data-rating="10" data-date="2023-08-02" data-title="You Can Negotiate Anything - by Herb Cohen">
<figure>
<a href="/book/NegotiateAnything"><img src="https://m.sive.rs/images/book/NegotiateAnything.webp" loading="lazy" alt="You Can Negotiate Anything - by Herb Cohen"></a>
<figcaption>
<h3><a href="/book/NegotiateAnything">You Can Negotiate Anything - by Herb Cohen</a></h3>
<p class="meta">
Recommend it: <strong>10</strong>/10.
Date read: <time datetime="2023-08-02">2023-08-02</time>.
</p>
<p>
Everything is negotiable. Challenge authority. You have the power in any situation. This is how to realize it and use it. A must-read classic from 1980 from a master negotiator. My notes here aren’t enough because the little book is filled with so many memorable stories — examples of great day-to-day moments of negotiation that will stick in your head for when you need them. (I especially loved the one about the power of the prisoner in solitary confinement.) So go buy and read the book. I’m giving it a 10/10 rating even though the second half of the book loses steam, because the first half is so crucial.
</p>
</figcaption>
</figure>
</li>
<li data-rating="10" data-date="2021-09-03" data-title="The Listening Book - by W.A. Mathieu">
<figure>
<a href="/book/ListeningBook"><img src="https://m.sive.rs/images/book/ListeningBook.webp" loading="lazy" alt="The Listening Book - by W.A. Mathieu"></a>
<figcaption>
<h3><a href="/book/ListeningBook">The Listening Book - by W.A. Mathieu</a></h3>
<p class="meta">
Recommend it: <strong>10</strong>/10.
Date read: <time datetime="2021-09-03">2021-09-03</time>.
</p>
<p>
Everyone should read this book of little essays about listening. It teaches your ears to pay more attention. It calls your attention to sounds you hadn’t noticed. It’s beautifully written, and makes your life better. I read it twice, 24 years ago, and reading it again this week, it was even better than I remembered.
</p>
</figcaption>
</figure>
</li>
<li data-rating="10" data-date="2018-07-25" data-title="The Courage to Be Disliked - by Ichiro Kishimi and Fumitake Koga">
<figure>
<a href="/book/Disliked"><img src="https://m.sive.rs/images/book/Disliked.webp" loading="lazy" alt="The Courage to Be Disliked - by Ichiro Kishimi and Fumitake Koga"></a>
<figcaption>
<h3><a href="/book/Disliked">The Courage to Be Disliked - by Ichiro Kishimi and Fumitake Koga</a></h3>
<p class="meta">
Recommend it: <strong>10</strong>/10.
Date read: <time datetime="2018-07-25">2018-07-25</time>.
</p>
<p>
Wow. A profound little philosophy book from Japan, communicating the psychology of Alfred Adler - a rival of Freud. Told as a conversation between an angry student and a patient teacher. A little book so good that I rushed home from other activities to keep reading it, and finished in a day. A surprisingly fresh perspective on how to live. (The “disliked” part is not the point, so don’t let the title distract you.)
</p>
</figcaption>
</figure>
</li>
<li data-rating="10" data-date="2017-09-27" data-title="Sum: Forty Tales from the Afterlives - by David Eagleman">
<figure>
<a href="/book/Sum"><img src="https://m.sive.rs/images/book/Sum.webp" loading="lazy" alt="Sum: Forty Tales from the Afterlives - by David Eagleman"></a>
<figcaption>
<h3><a href="/book/Sum">Sum: Forty Tales from the Afterlives - by David Eagleman</a></h3>
<p class="meta">
Recommend it: <strong>10</strong>/10.
Date read: <time datetime="2017-09-27">2017-09-27</time>.
</p>
<p>
Awesomely creative think-piece. 40 very short fictional stories about what happens when you die. The framework is inspiring for anyone: coming up with 40 different answers to any one question. But they’re also just brilliant ideas and powerful little fables. I just read it a 2nd time and love it even more now.
</p>
</figcaption>
</figure>
</li>
<li data-rating="10" data-date="2016-08-10" data-title="The Gardener and the Carpenter - by Alison Gopnik">
<figure>
<a href="/book/GardenerCarpenter"><img src="https://m.sive.rs/images/book/GardenerCarpenter.webp" loading="lazy" alt="The Gardener and the Carpenter - by Alison Gopnik"></a>
<figcaption>
<h3><a href="/book/GardenerCarpenter">The Gardener and the Carpenter - by Alison Gopnik</a></h3>
<p class="meta">
Recommend it: <strong>10</strong>/10.
Date read: <time datetime="2016-08-10">2016-08-10</time>.
</p>
<p>
Great philosophy of parenting, from a grandmother who is a wise professor of philosophy and a developmental psychologist. Such a beautiful mindset and outlook. Required reading for every parent. Re-read it often as a necessary reminder.
</p>
</figcaption>
</figure>
</li>
<li data-rating="10" data-date="2016-06-05" data-title="Playful Parenting - by Lawrence Cohen">
<figure>
<a href="/book/PlayfulParenting"><img src="https://m.sive.rs/images/book/PlayfulParenting.webp" loading="lazy" alt="Playful Parenting - by Lawrence Cohen"></a>
<figcaption>
<h3><a href="/book/PlayfulParenting">Playful Parenting - by Lawrence Cohen</a></h3>
<p class="meta">
Recommend it: <strong>10</strong>/10.
Date read: <time datetime="2016-06-05">2016-06-05</time>.
</p>
<p>
I’ve read many books on parenting, but this one is the best. It’s genius. My top recommendation for everyone with a kid age 1-13. Its point is that children communicate through play. So, to reach them: play! Anything can be done through play: teaching, emotional connection, processing difficult situations, and even discipline can be made playful. Read the whole book instead of just my notes, since my little take-away ideas are just reminders of the spirit of the book. I re-read these notes almost every week to remind me how to be a great parent. My kid is always thankful (communicated through giddy laughter) when I remember and use this approach.
</p>
</figcaption>
</figure>
</li>
<li data-rating="10" data-date="2015-08-01" data-title="On Writing Well - by William Zinsser">
<figure>
<a href="/book/OnWritingWell"><img src="https://m.sive.rs/images/book/OnWritingWell.webp" loading="lazy" alt="On Writing Well - by William Zinsser"></a>
<figcaption>
<h3><a href="/book/OnWritingWell">On Writing Well - by William Zinsser</a></h3>
<p class="meta">
Recommend it: <strong>10</strong>/10.
Date read: <time datetime="2015-08-01">2015-08-01</time>.
</p>
<p>
Great blunt advice about writing better non-fiction. So inspiring.
</p>
</figcaption>
</figure>
</li>
<li data-rating="10" data-date="2012-01-05" data-title="The War of Art - by Steven Pressfield">
<figure>
<a href="/book/WarOfArt"><img src="https://m.sive.rs/images/book/WarOfArt.webp" loading="lazy" alt="The War of Art - by Steven Pressfield"></a>
<figcaption>
<h3><a href="/book/WarOfArt">The War of Art - by Steven Pressfield</a></h3>
<p class="meta">
Recommend it: <strong>10</strong>/10.
Date read: <time datetime="2012-01-05">2012-01-05</time>.
</p>
<p>
Have you experienced a vision of the person you might become, the work you could accomplish, the realized being you were meant to be? Are you a writer who doesn’t write, a painter who doesn’t paint, an entrepreneur who never starts a venture? Then you know what “Resistance” is. This book is about that. Read it.
</p>
</figcaption>
</figure>
</li>
<li data-rating="10" data-date="2007-07-11" data-title="Stumbling on Happiness - by Daniel Gilbert">
<figure>
<a href="/book/StumblingOnHappiness"><img src="https://m.sive.rs/images/book/StumblingOnHappiness.webp" loading="lazy" alt="Stumbling on Happiness - by Daniel Gilbert"></a>
<figcaption>
<h3><a href="/book/StumblingOnHappiness">Stumbling on Happiness - by Daniel Gilbert</a></h3>
<p class="meta">
Recommend it: <strong>10</strong>/10.
Date read: <time datetime="2007-07-11">2007-07-11</time>.
</p>
<p>
Not at all new-agey, as the title might suggest. Harvard professor of psychology has studied happiness for years, and shares factual findings that will change the way you look at the world.
</p>
</figcaption>
</figure>
</li>
<li data-rating="10" data-date="2004-02-26" data-title="E-Myth Revisited - by Michael Gerber">
<figure>
<a href="/book/EMythRevisited"><img src="https://m.sive.rs/images/book/EMythRevisited.webp" loading="lazy" alt="E-Myth Revisited - by Michael Gerber"></a>
<figcaption>
<h3><a href="/book/EMythRevisited">E-Myth Revisited - by Michael Gerber</a></h3>
<p class="meta">
Recommend it: <strong>10</strong>/10.
Date read: <time datetime="2004-02-26">2004-02-26</time>.
</p>
<p>
Absolutely everyone who is an entrepreneur or wants to be one needs to read this book. I first read it after 10 years of successfully running my company, and was still blown away and totally humbled by its wisdom. Re-reading it today, I&#39;m amazed how my view of business was completely changed by this one little book. See my notes for examples, but definitely read the book itself to get the real impact.
</p>
</figcaption>
</figure>
</li>
<li data-rating="9" data-date="2026-02-25" data-title="You’re Not Listening - by Kate Murphy">
<figure>
<a href="/book/NotListening"><img src="https://m.sive.rs/images/book/NotListening.webp" loading="lazy" alt="You’re Not Listening - by Kate Murphy"></a>
<figcaption>
<h3><a href="/book/NotListening">You’re Not Listening - by Kate Murphy</a></h3>
<p class="meta">
Recommend it: <strong>9</strong>/10.
Date read: <time datetime="2026-02-25">2026-02-25</time>.
</p>
<p>
Being a great listener when people speak. Deep insights about understanding, connection, helping people express themselves, overcoming assumptions, the ethics of gossip, and more. Specific techniques for the support response, encouraging elaboration, and keeping it balanced. You can’t be ethical without being a good listener. When people say, “I can’t talk right now,” what they really mean is “I can’t listen right now.”
</p>
</figcaption>
</figure>
</li>
<li data-rating="9" data-date="2024-10-10" data-title="The Invention of the Jewish People - by Shlomo Sand">
<figure>
<a href="/book/InventJewish"><img src="https://m.sive.rs/images/book/InventJewish.webp" loading="lazy" alt="The Invention of the Jewish People - by Shlomo Sand"></a>
<figcaption>
<h3><a href="/book/InventJewish">The Invention of the Jewish People - by Shlomo Sand</a></h3>
<p class="meta">
Recommend it: <strong>9</strong>/10.
Date read: <time datetime="2024-10-10">2024-10-10</time>.
</p>
<p>
Fascinating subject. Countries are made of stories. Kings didn’t need their subjects to agree, but nations do. So to build a nation, they need to make a story that helps people feel a shared identity, nationalism, and what distinguishes them from their neighbors. Back-creating a history. Founders of Israel did this brilliantly.
</p>
</figcaption>
</figure>
</li>
<li data-rating="9" data-date="2024-04-05" data-title="Between Us: How Cultures Create Emotions - by Batja Mesquita">
<figure>
<a href="/book/BetweenUs"><img src="https://m.sive.rs/images/book/BetweenUs.webp" loading="lazy" alt="Between Us: How Cultures Create Emotions - by Batja Mesquita"></a>
<figcaption>
<h3><a href="/book/BetweenUs">Between Us: How Cultures Create Emotions - by Batja Mesquita</a></h3>
<p class="meta">
Recommend it: <strong>9</strong>/10.
Date read: <time datetime="2024-04-05">2024-04-05</time>.
</p>
<p>
Cultural psychology, studying emotions through the lens of culture. Your emotions are created by your culture. You should not be too sure that you share the emotional experiences of individuals from other cultures. Culture and emotion make each other up. Great insights!
</p>
</figcaption>
</figure>
</li>
<li data-rating="9" data-date="2024-03-10" data-title="China’s World View - by David Daokui Li">
<figure>
<a href="/book/ChinaWorldView"><img src="https://m.sive.rs/images/book/ChinaWorldView.webp" loading="lazy" alt="China’s World View - by David Daokui Li"></a>
<figcaption>
<h3><a href="/book/ChinaWorldView">China’s World View - by David Daokui Li</a></h3>
<p class="meta">
Recommend it: <strong>9</strong>/10.
Date read: <time datetime="2024-03-10">2024-03-10</time>.
</p>
<p>
Senior academic advisor to the Chinese Communist Party feels most political tensions come from a misunderstanding of China’s world view, hence the subtitle “demystifying to prevent global conflict”, and his intrinsic desire to explain. I love its insights and historical context, especially around “Respect-centered diplomacy” and how the CCP is structured.
</p>
</figcaption>
</figure>
</li>
<li data-rating="9" data-date="2024-02-03" data-title="Arabs - by Tim Mackintosh-Smith">
<figure>
<a href="/book/Arabs"><img src="https://m.sive.rs/images/book/Arabs.webp" loading="lazy" alt="Arabs - by Tim Mackintosh-Smith"></a>
<figcaption>
<h3><a href="/book/Arabs">Arabs - by Tim Mackintosh-Smith</a></h3>
<p class="meta">
Recommend it: <strong>9</strong>/10.
Date read: <time datetime="2024-02-03">2024-02-03</time>.
</p>
<p>
3000 years of factual Arab history, and personal insights from this Oxford Brit who lived in Yemen for 37 years, translates classical Arabic, and clearly cares a lot. Huge and thorough but really wonderful for those with the interest. I loved his writing style and poetic asides. Read my notes here for a taste. What a great book.
</p>
</figcaption>
</figure>
</li>
<li data-rating="9" data-date="2023-11-15" data-title="The Vagabond’s Way - by Rolf Potts">
<figure>
<a href="/book/VagabondsWay"><img src="https://m.sive.rs/images/book/VagabondsWay.webp" loading="lazy" alt="The Vagabond’s Way - by Rolf Potts"></a>
<figcaption>
<h3><a href="/book/VagabondsWay">The Vagabond’s Way - by Rolf Potts</a></h3>
<p class="meta">
Recommend it: <strong>9</strong>/10.
Date read: <time datetime="2023-11-15">2023-11-15</time>.
</p>
<p>
Best travel book I’ve ever read! Shook my soul many times. Tiny “daily meditation” format, with lots of quotes from others, but wow what wonderful insights. They make me yearn to travel again. Love love love these ideas and perspectives so much.
</p>
</figcaption>
</figure>
</li>
<li data-rating="9" data-date="2023-10-10" data-title="Finite and Infinite Games - by James P. Carse">
<figure>
<a href="/book/FiniteInfinite"><img src="https://m.sive.rs/images/book/FiniteInfinite.webp" loading="lazy" alt="Finite and Infinite Games - by James P. Carse"></a>
<figcaption>
<h3><a href="/book/FiniteInfinite">Finite and Infinite Games - by James P. Carse</a></h3>
<p class="meta">
Recommend it: <strong>9</strong>/10.
Date read: <time datetime="2023-10-10">2023-10-10</time>.
</p>
<p>
So abstract. Maybe the most abstract book you’ll ever read. Compares “finite” games with rules and winners, versus “infinite” games without winners where we can play with the game itself. Is it about a job versus a calling? Religion versus spirituality? A story versus story-telling? Who knows. Thought-provoking if you can apply the metaphor to whatever concerns you.
</p>
</figcaption>
</figure>
</li>
<li data-rating="9" data-date="2023-07-30" data-title="How Minds Change - by David McRaney">
<figure>
<a href="/book/HowMindsChange"><img src="https://m.sive.rs/images/book/HowMindsChange.webp" loading="lazy" alt="How Minds Change - by David McRaney"></a>
<figcaption>
<h3><a href="/book/HowMindsChange">How Minds Change - by David McRaney</a></h3>
<p class="meta">
Recommend it: <strong>9</strong>/10.
Date read: <time datetime="2023-07-30">2023-07-30</time>.
</p>
<p>
The psychology of how and why we believe. How we learn and change. The craft of doubt and persuasion. Insights into the social definition of truth. Epistemology. Certainty is a feeling not based on facts. Well-written with a nice balance of story-telling and deeper dives.
</p>
</figcaption>
</figure>
</li>
<li data-rating="9" data-date="2023-07-20" data-title="How Religion Evolved - by Robin Dunbar">
<figure>
<a href="/book/ReligionHowEvolved"><img src="https://m.sive.rs/images/book/ReligionHowEvolved.webp" loading="lazy" alt="How Religion Evolved - by Robin Dunbar"></a>
<figcaption>
<h3><a href="/book/ReligionHowEvolved">How Religion Evolved - by Robin Dunbar</a></h3>
<p class="meta">
Recommend it: <strong>9</strong>/10.
Date read: <time datetime="2023-07-20">2023-07-20</time>.
</p>
<p>
Great anthropology! So many insights into religions, tribes, friendships, organizations, the evolution of minds, superstition, and more. Got me thinking most about friendships.
</p>
</figcaption>
</figure>
</li>
<li data-rating="9" data-date="2023-06-22" data-title="Nothing &amp; Everything - by Val N. Tine">
<figure>
<a href="/book/NihilismNE"><img src="https://m.sive.rs/images/book/NihilismNE.webp" loading="lazy" alt="Nothing &amp; Everything - by Val N. Tine"></a>
<figcaption>
<h3><a href="/book/NihilismNE">Nothing &amp; Everything - by Val N. Tine</a></h3>
<p class="meta">
Recommend it: <strong>9</strong>/10.
Date read: <time datetime="2023-06-22">2023-06-22</time>.
</p>
<p>
I love this book so much. It&#39;s the joy of nihilism. Nothing is true. Everything is permitted. I agree completely. I would give it a 10-out-of-10 rating but I disliked the whole second half of the book. So just read the first half. See my notes here. If you like my book “Useful Not True”, you should read this.
</p>
</figcaption>
</figure>
</li>

<script>
// only if browser has JavaScript, add sorter links and functions
document.getElementById('intro').insertAdjacentHTML('beforeend', `
<p id="sorters">Sorted with <strong>my top recommendations up top</strong>.
Sort by
<a href="#" data-sort="date">newest</a>,
<a href="#" data-sort="rating">best</a>, or
<a href="#" data-sort="title">title</a>.
</p>
`);
function sortBooks(by) {
	const list = document.getElementById('booklist');
	const items = Array.from(list.querySelectorAll('li'));
	items.sort((a, b) => {
		const valA = a.getAttribute(`data-${by}`);
		const valB = b.getAttribute(`data-${by}`);
		if (by === 'title') {
			return valA.localeCompare(valB);
		} else if (by === 'rating') {
			return Number(valB) - Number(valA);
		} else if (by === 'date') {
			return new Date(valB) - new Date(valA);
		}
	});
	items.forEach(item => list.appendChild(item));
}
document.getElementById('sorters').addEventListener('click', function(e) {
	const link = e.target.closest('a');
	if (link && this.contains(link)) {
		e.preventDefault();
		sortBooks(link.dataset.sort);
	}
});
</script>
